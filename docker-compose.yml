# Local development services only. Never used for staging or production.
#   docker compose up -d
name: fieldmate

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fieldmate
      POSTGRES_PASSWORD: fieldmate
      POSTGRES_DB: fieldmate_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fieldmate -d fieldmate_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO no longer publishes community images to Docker Hub; quay.io is its own
  # registry. Pinned by digest (RELEASE.2025-09-07T16-13-09Z) so local storage
  # stays reproducible.
  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fieldmate
      MINIO_ROOT_PASSWORD: fieldmate-dev-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 fieldmate fieldmate-dev-secret &&
      mc mb --ignore-existing local/fieldmate-dev &&
      mc anonymous set none local/fieldmate-dev
      "
    restart: 'no'

volumes:
  postgres-data:
  minio-data:
